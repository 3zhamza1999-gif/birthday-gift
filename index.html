<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #000;
    color: #fff;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  canvas { position: fixed; top: 0; left: 0; z-index: 1; }
  
  #intro-text {
    position: relative;
    z-index: 2;
    font-size: 4rem;
    font-weight: bold;
    color: #ff69b4;
    text-shadow: 0 0 20px #ff1493;
    letter-spacing: 5px;
    transition: opacity 0.5s;
  }

  #book-stage {
    display: none;
    position: relative;
    z-index: 3;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .message-box {
    background: #fff;
    color: #ff1493;
    padding: 15px 30px;
    border-radius: 15px;
    font-family: 'Brush Script MT', cursive;
    font-size: 1.8rem;
    min-height: 60px;
    box-shadow: 0 0 15px rgba(255, 105, 180, 0.6);
    text-align: center;
  }
  .book {
    width: 320px;
    height: 220px;
    position: relative;
    perspective: 1000px;
    cursor: pointer;
  }
  .page {
    width: 100%;
    height: 100%;
    position: absolute;
    background: #fff;
    border-radius: 10px;
    display: flex;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    transition: transform 0.8s ease;
    transform-origin: left center;
  }
  .page img { width: 50%; height: 100%; object-fit: cover; border-right: 1px solid #eee; }
  .cover {
    background: #fff;
    color: #ff1493;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    font-size: 1.5rem;
    z-index: 5;
  }
  .flipped { transform: rotateY(-180deg); pointer-events: none; opacity: 0; }

  #heart-stage {
    display: none;
    position: relative;
    z-index: 4;
    width: 350px;
    height: 320px;
  }
  .heart-item {
    position: absolute;
    width: 55px;
    height: 55px;
    border-radius: 8px;
    border: 2px solid #ff69b4;
    box-shadow: 0 0 12px #ff1493;
    object-fit: cover;
    transition: all 1s ease;
    left: 145px; top: 130px;
  }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div id="intro-text">3</div>

<div id="book-stage">
  <div class="message-box" id="msgBox">اضغط على البطاقة لفتحها ❤️</div>
  <div class="book" id="book">
    <div class="page cover">
      <div style="font-size: 3rem;">🫶❤️</div>
      <p style="font-size: 1rem; margin-top: 10px;">Tap to open</p>
    </div>
    <div class="page" data-msg="Stay happy always, my friend! ✨" style="z-index: 4;">
      <img src="1.jpg" alt="1">
      <img src="2.jpg" alt="2">
    </div>
    <div class="page" data-msg="Happy Birthday! 🎂" style="z-index: 3;">
      <img src="3.jpg" alt="3">
      <img src="4.jpg" alt="4">
    </div>
  </div>
</div>

<div id="heart-stage"></div>

<script>
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const chars = "HAPPYBIRTHDAY❤️01";
  const fontSize = 16;
  const columns = canvas.width / fontSize;
  const drops = Array(Math.floor(columns)).fill(1);
  let mode = "matrix";

  function drawBg() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (mode === "matrix") {
      ctx.fillStyle = "#ff69b4";
      ctx.font = fontSize + "px monospace";
      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    } else {
      ctx.fillStyle = "#ffffff";
      for (let i = 0; i < 5; i++) {
        ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 2, 2);
      }
    }
  }
  setInterval(drawBg, 40);

  const words = ["3", "2", "1", "HAPPY", "BIRTHDAY", "❤️"];
  let wordIndex = 0;
  const introEl = document.getElementById('intro-text');

  const wordTimer = setInterval(() => {
    wordIndex++;
    if (wordIndex < words.length) {
      introEl.innerText = words[wordIndex];
    } else {
      clearInterval(wordTimer);
      introEl.style.display = "none";
      mode = "stars";
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      document.getElementById('book-stage').style.display = "flex";
    }
  }, 1100);

  const pages = document.querySelectorAll('.page');
  const msgBox = document.getElementById('msgBox');
  let currentPage = 0;

  document.getElementById('book').addEventListener('click', () => {
    if (currentPage < pages.length) {
      if(currentPage > 0) {
        msgBox.innerText = pages[currentPage].getAttribute('data-msg');
      }
      pages[currentPage].classList.add('flipped');
      currentPage++;
    } else {
      document.getElementById('book-stage').style.display = "none";
      buildHeart();
    }
  });

  function buildHeart() {
    const heartStage = document.getElementById('heart-stage');
    heartStage.style.display = "block";
    const photos = ["1.jpg", "2.jpg", "3.jpg", "4.jpg"];
    const coords = [
      [145, 70], [105, 40], [60, 40], [25, 75], [25, 125],
      [60, 175], [105, 220], [145, 260], [185, 220], [230, 175],
      [265, 125], [265, 75], [230, 40], [185, 40], [145, 135]
    ];

    coords.forEach((pos, idx) => {
      const img = document.createElement('img');
      img.src = photos[idx % photos.length];
      img.className = 'heart-item';
      heartStage.appendChild(img);
      
      setTimeout(() => {
        img.style.left = pos[0] + "px";
        img.style.top = pos[1] + "px";
      }, idx * 120);
    });
  }
</script>
</body>
</html>
