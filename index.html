<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساحة للحب، الضحك، والصور الحلوة ❤️</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #d63384;
            margin-bottom: 10px;
            font-size: 24px;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 20px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .gallery img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .gallery img:hover {
            transform: scale(1.03);
        }
        button {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(255, 77, 109, 0.3);
        }
        button:hover {
            background-color: #c9184a;
            transform: scale(1.05);
        }
        #secret-message {
            margin-top: 15px;
            font-weight: bold;
            color: #6a040f;
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>✨ أهلاً بك في مساحة الضحك والحب ✨</h1>
        <p>مكان مخصص للأجواء الحلوة، الصحبة الجميلة، والذكريات اللي تخلي الابتسامة ما تفارق الوجه! 😄❤️</p>

        <!-- شبكة عرض الصور الموجودة في مستودعك -->
        <div class="gallery">
            <img src="1.jpg" alt="ذكريات 1">
            <img src="2.jpg" alt="ذكريات 2">
            <img src="3.jpg" alt="ذكريات 3">
            <img src="4.jpg" alt="ذكريات 4">
        </div>

        <button onclick="showSurprise()">اضغط هنا لرسالة خاصة 🎁</button>

        <div id="secret-message">
            <p>😂 شكلك صدقت إن فيه رسالة رسمية؟<br>المهم: الله لا يحرِمنا من الضحكة والوناسة والصحبة الطيبة دايم الدوم! ❤️🙌</p>
        </div>
    </div>

    <script>
        function showSurprise() {
            var msg = document.getElementById('secret-message');
            if (msg.style.display === 'none' || msg.style.display === '') {
                msg.style.display = 'block';
            } else {
                msg.style.display = 'none';
            }
        }
    </script>

</body>
</html>
